name: Front image

# Builds the production image on a GitHub-hosted runner and publishes it to
# GHCR, so merges no longer build on the game server. Coolify then only pulls
# the image (see docs/build-image-ghcr.md). Rollback: redeploy a previous
# ghcr.io/yokkai-collec/yokkai-collec-v2:<sha> tag in Coolify.
on:
  push:
    branches:
      - master
  # Build only (no push, no deploy) to validate image changes before merge.
  pull_request:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
      - package.json
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: front-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/yokkai-collec/yokkai-collec-v2

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Until the Actions variables exist, master pushes skip the image with a
      # warning instead of failing (Coolify keeps building with Railpack).
      - name: Check build variables
        id: check
        if: github.event_name != 'pull_request'

        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          missing=0
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!name}" ]; then echo "::warning::Missing Actions variable $name: image not published"; missing=1; fi
          done
          if [ $missing = 0 ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'pull_request' || steps.check.outputs.ready == 'true'

      - uses: docker/login-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'pull_request' || steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Placeholders only matter for pull requests: on master the check above
          # stops the build when a real value is missing.
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_dummy' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.invalid' }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_GIPHY_API_KEY=${{ vars.NEXT_PUBLIC_GIPHY_API_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_AUTH_SUPPORT_URL=${{ vars.NEXT_PUBLIC_AUTH_SUPPORT_URL }}
            NEXT_PUBLIC_STABLE_BINDERS_ENABLED=${{ vars.NEXT_PUBLIC_STABLE_BINDERS_ENABLED }}
            NEXT_PUBLIC_I18N_ENABLED=${{ vars.NEXT_PUBLIC_I18N_ENABLED }}
            CSP_ENFORCE=${{ vars.CSP_ENFORCE }}

      # Optional until Coolify is switched to the image: without both secrets
      # this step does nothing and Coolify keeps its current behaviour.
      - name: Ask Coolify to deploy the new image
        if: steps.check.outputs.ready == 'true'
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "Coolify webhook not configured: image published only."
            exit 0
          fi
          curl -fsS --max-time 30 -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$COOLIFY_DEPLOY_WEBHOOK" > /dev/null
          echo "Coolify deployment requested for ${{ github.sha }}."

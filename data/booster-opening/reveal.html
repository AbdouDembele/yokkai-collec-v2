<title>Yokkai booster opening</title>
<style>
:root { --p:218px;--foil-h:388px;--foil-cut:17.3%;--booster-accent:#8dbdff;--spread:48px; }
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0;height:100%;overflow:hidden; }
.scene { position:relative;width:100%;height:100svh;min-height:0;display:grid;place-items:center;isolation:isolate;perspective:1200px; }
.ambient,.orbit,.floor,.burst,.ring,.rays { position:absolute;pointer-events:none; }
.ambient { left:50%;top:48%;width:min(90vw,680px);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(ellipse,#286cd529,transparent 67%); }
.orbit { left:50%;top:49%;width:min(95vw,560px);aspect-ratio:1;border:1px solid #5187c211;border-radius:50%;transform:translate(-50%,-50%) rotateX(15deg); }
.orbit::after { content:"";position:absolute;inset:7%;border:1px dashed #48729b15;border-radius:50%; }
.stage { position:relative;width:var(--p);height:var(--foil-h); }
.floor { left:50%;top:100%;width:110%;height:18px;border-radius:50%;background:#000;filter:blur(12px);transform:translateX(-50%);opacity:.7; }
.pack-position { position:absolute;inset:0;z-index:4;perspective:900px; }
.pack-float,.pack-entrance { position:absolute;inset:0;transform-style:preserve-3d; }
.pack-float { animation:booster-float 5s ease-in-out infinite; }
.foil-body,.foil-lid { position:absolute;inset:0;backface-visibility:hidden; }
.foil-body img,.foil-lid img { display:block;width:100%;height:100%;object-fit:contain; }
.foil-body { clip-path:polygon(0 calc(var(--foil-cut) - .3%),8% calc(var(--foil-cut) + .5%),18% calc(var(--foil-cut) - .5%),28% calc(var(--foil-cut) + .3%),38% calc(var(--foil-cut) - .3%),48% calc(var(--foil-cut) + .4%),58% calc(var(--foil-cut) - .5%),68% calc(var(--foil-cut) + .3%),78% calc(var(--foil-cut) - .3%),88% calc(var(--foil-cut) + .4%),100% calc(var(--foil-cut) - .3%),100% 100%,0 100%); }
.foil-lid { clip-path:polygon(0 0,100% 0,100% calc(var(--foil-cut) - .3%),88% calc(var(--foil-cut) + .4%),78% calc(var(--foil-cut) - .3%),68% calc(var(--foil-cut) + .3%),58% calc(var(--foil-cut) - .5%),48% calc(var(--foil-cut) + .4%),38% calc(var(--foil-cut) - .3%),28% calc(var(--foil-cut) + .3%),18% calc(var(--foil-cut) - .5%),8% calc(var(--foil-cut) + .5%),0 calc(var(--foil-cut) - .3%));transform-origin:90% var(--foil-cut);z-index:2; }
.pack-sheen { position:absolute;inset:0;background:linear-gradient(115deg,transparent 25%,#e7f6ff00 40%,#e7f6ff75 49%,transparent 57%);mask:var(--pack-mask) center/100% 100%;opacity:.24;animation:booster-sheen 6s infinite;pointer-events:none; }
.foil-edge { position:absolute;left:6%;right:5%;top:var(--foil-cut);height:2px;background:white;box-shadow:0 0 10px #fff,0 0 25px #63c8ff,0 0 60px #196dff;transform:scaleX(0);opacity:0;transform-origin:left;z-index:4; }
.charge-aura { position:absolute;inset:-55px;background:radial-gradient(ellipse,#3b98ff55,transparent 67%);opacity:0;z-index:-1; }
.opening-cards { position:absolute;left:50%;top:50%;width:93%;aspect-ratio:5/7;transform:translate(-50%,-50%);z-index:3; }
.opening-card { position:absolute;inset:0;border-radius:14px;background:url('__CARD_BACK__') center/100% 100% no-repeat;box-shadow:0 0 0 1px #a3cbff38,0 14px 30px #0008;opacity:0;backface-visibility:hidden; }
.burst,.ring,.rays { left:50%;top:45%;opacity:0;z-index:5;transform:translate(-50%,-50%) scale(.1); }
.burst { width:420px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff,#b3e7ff 3%,#3990ff80 13%,transparent 56%); }
.ring { width:180px;aspect-ratio:1;border:2px solid #c7e8ff;border-radius:50%;box-shadow:0 0 8px var(--booster-accent); }
.rays { width:650px;aspect-ratio:1;z-index:1;background:repeating-conic-gradient(from 5deg,transparent 0deg 16deg,#8ac7ff14 17deg,transparent 19deg 33deg);mask-image:radial-gradient(circle,transparent 5%,#000 15%,transparent 63%); }
.opening-particles { position:absolute;left:50%;top:var(--foil-cut);z-index:6;pointer-events:none; }
.opening-particles i { position:absolute;width:var(--length);height:var(--size);border-radius:1px;background:var(--color);opacity:0; }
.progress { position:absolute;inset:auto 0 0;height:2px;background:#6bb8ff;transform:scaleX(0);transform-origin:left;box-shadow:0 0 15px #69b8ff; }
.running .pack-float,.running .pack-sheen { animation:none; }
.running .pack-sheen { opacity:0; }
.running .pack-entrance { animation:booster-tension .68s cubic-bezier(.6,0,1,1) both; }
.running .charge-aura { animation:booster-charge 2.94s ease-in both; }
.running .foil-edge { animation:booster-cut .19s cubic-bezier(.6,0,1,1) .52s both,booster-cut-fade .28s linear .68s forwards; }
.running .foil-lid { animation:foil-peel 0.67s cubic-bezier(.16,.85,.3,1) 0.68s both; }
.running .foil-body { animation:foil-body-open .9s cubic-bezier(.3,0,.25,1) .68s both; }
.running .burst { animation:booster-burst .85s cubic-bezier(.1,.65,.2,1) .87s both; }
.running .ring { animation:booster-ring .78s cubic-bezier(.08,.65,.2,1) .87s forwards; }
.running .rays { animation:booster-rays 1.2s linear .87s both; }
.running .floor { animation:booster-floor .7s linear .87s both; }
.running .opening-card { animation:booster-fan 1.05s cubic-bezier(.17,.84,.23,1) calc(1.04s + var(--order) * .065s) both; }
.running .opening-particles i { animation:booster-particle var(--life) cubic-bezier(.2,.65,.4,1) var(--delay) forwards; }
.running .progress { animation:booster-progress 2.94s linear both; }

@keyframes booster-sheen { 0%,65%,100%{transform:translateX(-20%);opacity:0}75%{opacity:.35}85%{transform:translateX(16%);opacity:0} }
@keyframes booster-tension { 0%{transform:rotate(0) scale(1)}55%{transform:rotate(-3deg) translateY(-3px)}85%{transform:rotate(2deg) translateY(-5px)}100%{transform:rotate(-1deg) translateY(-6px)} }
@keyframes booster-charge { 0%{opacity:0;transform:scale(.8)}23%,45%{opacity:1;transform:scale(1.18)}100%{opacity:0;transform:scale(1.18)} }
@keyframes booster-cut { 0%{transform:scaleX(0);opacity:0}20%{transform:scaleX(.15);opacity:1}100%{transform:scaleX(1);opacity:1} }
@keyframes booster-cut-fade { from{opacity:1;transform:scaleX(1)}to{opacity:0;transform:scaleX(1.15)} }
@keyframes foil-peel { 0%{transform:translate(0,0) rotate(0);opacity:1}15%{transform:translate(8px,-14px) rotate(-7deg);opacity:1}50%{transform:translate(130px,-90px) rotate(27deg);opacity:1}100%{transform:translate(390px,-230px) rotate(95deg);opacity:0} }
@keyframes foil-body-open { 0%{transform:translateY(0) scale(1);opacity:1}20%{transform:translateY(18px);opacity:1}40%{transform:translateY(25px) rotate(-5deg);opacity:1}100%{transform:translateY(340px) rotate(13deg);opacity:0} }
@keyframes booster-burst { 0%{opacity:0;transform:translate(-50%,-50%) scale(.12)}14%{opacity:.95;transform:translate(-50%,-50%) scale(.9)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)} }
@keyframes booster-ring { from{opacity:.75;transform:translate(-50%,-50%) scale(.2)}to{opacity:0;transform:translate(-50%,-50%) scale(5)} }
@keyframes booster-rays { 0%{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) rotate(8deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(30deg) scale(1.3)} }
@keyframes booster-floor { from{opacity:.7}to{opacity:.2} }
@keyframes booster-fan { 0%{opacity:0;transform:translate(0,90px) rotate(0) scale(.65)}48%{opacity:1;transform:translate(calc(var(--index) * var(--spread) * 1.15),calc(var(--distance) * 13px - 50px)) rotate(calc(var(--index) * 10.35deg)) scale(1.07)}100%{opacity:1;transform:translate(calc(var(--index) * var(--spread)),calc(var(--distance) * 13px)) rotate(calc(var(--index) * 9deg)) scale(1)} }
@keyframes booster-particle { 0%{opacity:1;transform:translate(0,var(--offset)) rotate(var(--angle)) scaleX(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--angle)) scaleX(.2)} }
@keyframes booster-progress { from{transform:scaleX(0)}to{transform:scaleX(1)} }
@keyframes booster-reduced-out { from{opacity:1}to{opacity:0} }
@keyframes booster-reduced-in { from{opacity:0}to{opacity:1} }
@media(max-width:600px) { .scene{--spread:min(34px,9vw)}.opening-cards{width:87%}.ring{width:120px}.orbit{width:min(95vw,340px)}.opening-card{border-radius:10px} }
@media(prefers-reduced-motion:reduce) {

 .scene.running .opening-card { animation:booster-reduced-in .18s linear both!important; }
 .scene.running .opening-cards { opacity:1; }
 .charge-aura,.burst,.ring,.rays,.opening-particles,.progress { display:none; }
}
</style>

<script>
(() => {
  'use strict';
  const scene = document.getElementById('scene');
  const packBody = document.getElementById('packBody');
  const packLid = document.getElementById('packLid');
  let loadSequence = 0;
  const pendingLoads = new Set();
  let packRatio = 1.7757;
  let resizeFrame = 0;

  // A pixel fallback avoids CSS typed division/multiplication compatibility
  // differences on older mobile browsers, and honors the containing viewport.
  function updateLayout() {
    const vw = scene.clientWidth || window.innerWidth;
    const vh = scene.clientHeight || window.innerHeight;
    let limit = 218, widthFactor = .57, heightFactor = .70;
    if (vw <= 900) { limit = 190; }
    if (vw <= 600) { limit = 158; widthFactor = .58; }
    if (vw <= 360) { limit = 158; widthFactor = .60; heightFactor = .68; }
    if (vh <= 500) { limit = 200; widthFactor = .39; heightFactor = .63; }
    if (vh <= 320) { limit = 150; widthFactor = .35; heightFactor = .59; }
    const width = Math.max(1, Math.min(limit, vw * widthFactor, vh * heightFactor / packRatio));
    scene.style.setProperty('--p', width.toFixed(2) + 'px');
    scene.style.setProperty('--foil-h', (width * packRatio).toFixed(2) + 'px');
  }
  function handleResize() {
    if (resizeFrame) cancelAnimationFrame(resizeFrame);
    resizeFrame = requestAnimationFrame(() => { resizeFrame = 0; updateLayout(); });
  }
  window.addEventListener('resize', handleResize, {passive:true});
  if (window.visualViewport) window.visualViewport.addEventListener('resize', handleResize, {passive:true});

  function replay() {
    scene.classList.remove('running');
    // Force one style recalculation so all individual keyframes reset together.
    void scene.offsetWidth;
    scene.classList.add('running');
  }

  function setDimensions(img) {
    if (!img.naturalWidth || !img.naturalHeight) throw new Error('Booster image not decoded');
    packRatio = img.naturalHeight / img.naturalWidth;
    scene.style.setProperty('--pack-ratio', packRatio.toFixed(6));
    updateLayout();
  }

  async function ready(img) {
    return new Promise((resolve,reject)=>{
      let settled=false;
      const finish=ok=>{
        if(settled)return;
        settled=true;clearTimeout(timer);pendingLoads.delete(cancel);
        img.removeEventListener('load',loaded);img.removeEventListener('error',failed);
        ok?resolve(img):reject(new Error('Booster image unavailable'));
      };
      const loaded=()=>finish(img.naturalWidth>0&&img.naturalHeight>0);
      const failed=()=>finish(false);
      const cancel=()=>finish(false);
      pendingLoads.add(cancel);
      const timer=setTimeout(failed,5000);
      img.addEventListener('load',loaded);img.addEventListener('error',failed);
      if(img.complete)loaded();
    });
  }

  async function setYokkaiBooster(data = {}) {
    const opts = typeof data === 'string' ? {boosterImage:data} : (data || {});
    const url = opts.boosterImage || opts.packImage || opts.image || opts.imageUrl || opts.url;
    if (!url) { replay(); return true; }
    if (typeof url !== 'string') throw new TypeError('boosterImage doit être une URL ou une data URI');
    const seq = ++loadSequence;
    const candidate = new Image();
    candidate.decoding = 'async';
    candidate.src = url;
    const back = new Image();
    back.src = '__CARD_BACK__';
    await Promise.all([ready(candidate), ready(back)]);
    if (seq !== loadSequence) return false; // a newer image request superseded this one

    const cut = Number(opts.tearAt);
    if (opts.tearAt !== undefined && Number.isFinite(cut))
      scene.style.setProperty('--foil-cut', `${Math.min(18, Math.max(6, cut))}%`);
    else scene.style.setProperty('--foil-cut', '17.3%');

    if (typeof opts.accentColor === 'string' && opts.accentColor.length < 100 &&
        typeof CSS !== 'undefined' && CSS.supports('color', opts.accentColor)) {
      scene.style.setProperty('--booster-accent', opts.accentColor);
    } else {
      scene.style.setProperty('--booster-accent', '#a8d2ff');
    }

    scene.classList.remove('running');
    scene.style.setProperty('--pack-mask', `url(${JSON.stringify(url)})`);
    packBody.src = url;
    packLid.src = url;
    setDimensions(candidate);
    await Promise.all([ready(packBody), ready(packLid)]);
    if (seq !== loadSequence) return false;
    replay();
    return true;
  }

  window.replayYokkaiBooster = replay;
  window.setYokkaiBooster = setYokkaiBooster;

  window.addEventListener('pagehide',()=>{
    loadSequence++;
    for(const cancel of pendingLoads)cancel();
    if(resizeFrame)cancelAnimationFrame(resizeFrame);
    window.removeEventListener('resize',handleResize);
    window.visualViewport?.removeEventListener('resize',handleResize);
  },{once:true});
})();
